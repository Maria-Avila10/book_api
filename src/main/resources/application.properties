# Nombre de la app
spring.application.name=book-api

# Configuraci\u00F3n de la base de datos PostgreSQL en Docker
spring.datasource.url=jdbc:postgresql://pgdb:5432/bookdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=app_user
spring.datasource.password=supersegura123
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Liquibase (si lo usas)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Swagger/OpenAPI
springdoc.swagger-ui.url=/openapi.yaml

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.aop.auto=false
spring.aop.proxy-target-class=false
logging.level.org.springframework.boot.autoconfigure=ERROR
spring.main.log-startup-info=false
